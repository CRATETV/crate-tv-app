name: Auto-Unlist Expired Festival Films

# Reliability backstop for /api/auto-unlist-expired-festival-films.
#
# That endpoint is also declared in vercel.json as a native Vercel Cron
# Job (every 6h) — but Vercel's cron registration got stuck on a stale
# deployment from Aug 22 and silently stopped re-syncing on every deploy
# since, despite `vercel deploy --prod` (their own documented fix) having
# zero effect. Confirmed via their own API: the cron subsystem's bound
# deploymentId never advanced past a build from before this endpoint even
# existed. Real, live consequence: five festival blocks and 17 films sat
# on the site up to a week past when they should have come down,
# discovered only because it was manually reported.
#
# Running the same trigger here, independent of Vercel's cron beta,
# means this can't silently stop working the same way again — a failure
# here shows up as a red X in the Actions tab instead of a customer
# noticing weeks later.
#
# Setup (one-time): add a repository secret named CRON_SECRET with the
# same value as the CRON_SECRET env var in Vercel (Settings > Secrets and
# variables > Actions > New repository secret).

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {} # allows a manual "Run workflow" from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call auto-unlist-expired-festival-films
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "https://cratetv.net/api/auto-unlist-expired-festival-films" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -ne 200 ]; then
            echo "::error::auto-unlist-expired-festival-films returned $status"
            exit 1
          fi
